<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Compras Interactiva</title>
    <style>
        :root {
            --color-primary: #a8d8ea;
            --color-secondary: #ffd6e7;
            --color-accent: #c1e1c1;
            --color-background: #fff9f5;
            --color-text: #333333;
            --color-border: #e0c9f1;
            --color-title: #2c5aa0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--color-background); color: var(--color-text); line-height: 1.6; padding: 10px; }
        .container { max-width: 100%; margin: 0 auto; background-color: white; border-radius: 12px; box-shadow: 0 3px 10px rgba(0,0,0,0.1); overflow: hidden; }
        header { background-color: var(--color-primary); padding: 15px; text-align: center; border-bottom: 2px solid var(--color-border); }
        h1 { color: var(--color-title); margin-bottom: 8px; font-size: 1.5rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        .description { font-size: 0.85rem; color: #555; }
        .content { display: flex; flex-direction: column; }
        .shopping-list { padding: 15px; border-bottom: 2px dashed var(--color-border); }
        .cart { padding: 15px; }
        .category { margin-bottom: 20px; }
        .category-title { background-color: var(--color-accent); padding: 6px 12px; border-radius: 6px; margin-bottom: 8px; font-weight: bold; color: var(--color-text); font-size: 0.9rem; }
        .product-item { display: flex; flex-direction: column; padding: 8px 0; border-bottom: 1px solid #f0f0f0; gap: 8px; }
        .product-item:last-child { border-bottom: none; }
        .product-main { display: flex; align-items: center; width: 100%; }
        .checkbox-container { margin-right: 8px; }
        input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        .product-name { flex: 1; font-size: 0.9rem; }
        .inline-inputs { width: 100%; padding: 8px 0; }
        .input-group { display: flex; flex-wrap: wrap; gap: 10px; width: 100%; }
        .input-field { flex: 1; min-width: 120px; display: flex; flex-direction: column; gap: 4px; }
        .input-label { font-size: 0.75rem; font-weight: 600; color: var(--color-title); }
        .price-input, .quantity-input { width: 100%; padding: 8px; border: 1px solid var(--color-border); border-radius: 4px; text-align: right; font-size: 0.9rem; transition: background-color 0.25s, border-color 0.25s, box-shadow 0.25s; }
        .price-input::placeholder, .quantity-input::placeholder { color: #555; opacity: 0.9; }
        .input-highlight { background-color: #fffbe6; border: 2px solid #ffb74d; box-shadow: 0 0 0 3px rgba(255,183,77,0.25); }
        .price-input:focus, .quantity-input:focus { outline: none; border-color: var(--color-title); box-shadow: 0 0 0 3px rgba(44,90,160,0.2); }
        .item-total { font-weight: bold; color: var(--color-title); text-align: right; padding: 8px 0; font-size: 0.9rem; min-width: 80px; align-self: center; }
        .total-section { margin-top: 15px; padding: 12px; background-color: var(--color-secondary); border-radius: 8px; text-align: center; }
        .total-amount { font-size: 1.3rem; font-weight: bold; margin-top: 5px; color: var(--color-title); }
        button { background-color: var(--color-primary); color: var(--color-text); border: none; padding: 10px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: background-color 0.3s; margin-top: 8px; font-size: 0.85rem; width: 100%; }
        button:hover { background-color: #8bc5d8; }
        .calculate-btn { background-color: var(--color-accent); margin-right: 0; margin-bottom: 8px; }
        .calculate-btn:hover { background-color: #a8d4a8; }
        #generate-list { background-color: #ffb74d; color: #333; margin-bottom: 8px; }
        #generate-list:hover { background-color: #e5a53c; }
        .empty-cart { text-align: center; color: #888; padding: 15px; font-size: 0.9rem; }
        h2 { font-size: 1.1rem; margin-bottom: 12px; color: var(--color-title); }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #fff; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .modal-content h3 { margin-bottom: 10px; color: var(--color-title); }
        #list-output { width: 100%; height: 200px; padding: 10px; border: 1px solid var(--color-border); border-radius: 8px; font-family: monospace; font-size: 0.9rem; resize: none; margin-bottom: 10px; }
        .modal-btns { display: flex; gap: 8px; }
        .modal-btns button { flex: 1; margin-top: 0; }
        #close-modal { background: #888; color: white; }
        #copy-list { background: #4CAF50; color: white; }
        @media (min-width: 768px) {
            body { padding: 20px; }
            .container { max-width: 1000px; border-radius: 15px; }
            header { padding: 20px; }
            h1 { font-size: 2.2rem; margin-bottom: 10px; }
            .description { font-size: 1rem; }
            .content { flex-direction: row; }
            .shopping-list { flex: 1; padding: 20px; border-right: 2px dashed var(--color-border); border-bottom: none; }
            .cart { flex: 1; padding: 20px; }
            .product-item { flex-direction: row; align-items: center; gap: 10px; }
            .product-main { width: auto; flex: 1; }
            .inline-inputs { width: auto; padding: 0; }
            .input-group { flex-wrap: nowrap; width: auto; }
            .input-field { min-width: 80px; }
            .price-input, .quantity-input { width: 80px; }
            button { width: auto; padding: 10px 15px; font-size: 1rem; }
            .calculate-btn { margin-right: 10px; margin-bottom: 0; }
            h2 { font-size: 1.3rem; }
        }
        @media (max-width: 360px) {
            .input-group { flex-direction: column; gap: 8px; }
            .input-field { min-width: 100%; }
            .price-input, .quantity-input { width: 100%; }
            .item-total { text-align: left; padding-left: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Lista de Compras</h1>
            <p class="description">Marca los productos que necesitas y luego ingresa los precios y cantidades en el supermercado</p>
        </header>
        <div class="content">
            <div class="shopping-list" id="shopping-list">
                <h2>Productos Disponibles</h2>
            </div>
            <div class="cart">
                <h2>Carrito de Compras</h2>
                <div id="cart-items"><div class="empty-cart">No hay productos seleccionados</div></div>
                <div class="total-section">
                    <div>Total de la compra:</div>
                    <div class="total-amount" id="total-amount">$0.00</div>
                    <button id="calculate-total" class="calculate-btn">Calcular Total</button>
                    <button id="generate-list">📝 Generar Lista (Texto)</button>
                    <button id="clear-cart">Limpiar Carrito</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para lista de texto -->
    <div id="list-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Lista para Copiar</h3>
            <textarea id="list-output" readonly></textarea>
            <div class="modal-btns">
                <button id="copy-list">Copiar</button>
                <button id="close-modal">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        const productsData = {
            "CARNES": [
                { "id": "pollo", "name": "Pollo" }, { "id": "huevos", "name": "Huevos" },
                { "id": "carne-res", "name": "Carne de res" }, { "id": "pescado", "name": "Pescado" },
                { "id": "cochino", "name": "Chancho" }
            ],
            "VEGETALES": [
                { "id": "brocoli", "name": "Brócoli" }, { "id": "lechuga", "name": "Lechuga" },
                { "id": "cebolla", "name": "Cebolla" }, { "id": "ajo", "name": "Ajo" },
                { "id": "zanahoria", "name": "Zanahoria" }, { "id": "repollo", "name": "Repollo" },
                { "id": "auyama", "name": "Auyama" }, { "id": "pepino", "name": "Pepino" },
                { "id": "remolacha", "name": "Remolacha" }, { "id": "calabacin", "name": "Calabacín" },
                { "id": "aji-rojo", "name": "Ají rojo" }, { "id": "aji-verde", "name": "Ají verde" },
                { "id": "aji-amarillo", "name": "Ají amarillo" }, { "id": "pimenton", "name": "Pimentón" },
                { "id": "maiz", "name": "Choclo" }, { "id": "tomate", "name": "Tomate" },
                { "id": "espinaca", "name": "Espinaca" }
            ],
            "FRUTAS": [
                { "id": "cambur", "name": "Cambur" }, { "id": "platano", "name": "Plátano" },
                { "id": "uvas", "name": "Uvas" }, { "id": "naranjas", "name": "Naranjas" },
                { "id": "limon", "name": "Limón" }, { "id": "manzana", "name": "Manzana" }
            ],
            "CEREALES Y SEMILLAS": [
                { "id": "quinua", "name": "Quinua" }, { "id": "avena", "name": "Avena" },
                { "id": "chia", "name": "Chía" }, { "id": "almendras", "name": "Almendras" },
                { "id": "nueces", "name": "Nueces" }, { "id": "semillas-calabaza", "name": "Semillas de calabaza" },
                { "id": "ajonjoli", "name": "Ajonjolí" }
            ],
            "OTROS": [
                { "id": "aceite-oliva", "name": "Aceite de oliva" }, { "id": "manteca", "name": "Manteca" },
                { "id": "leche", "name": "leche" }, { "id": "yogurt", "name": "Yogurt" },
                { "id": "queso", "name": "Queso" }
            ],
            "LIMPIEZA Y OTROS": [
                { "id": "cloro", "name": "Cloro" }, { "id": "Desinfectante", "name": "Desinfectante" },
                { "id": "detergente", "name": "Detergente" }, { "id": "champú", "name": "Champú" },
                { "id": "acondicionador", "name": "Acondicionador" }, { "id": "jabondebano", "name": "Jabón baño" },
                { "id": "desodorante", "name": "Desodorante" }, { "id": "papelhigienico", "name": "Papel Toilet" },
                { "id": "desengrasante", "name": "Desengrasante" }, { "id": "lavavajilla", "name": "Lava vajilla" }
            ]
        };

        document.addEventListener('DOMContentLoaded', function() {
            const shoppingList = document.getElementById('shopping-list');
            const cartItems = document.getElementById('cart-items');
            const totalAmount = document.getElementById('total-amount');
            const clearCartBtn = document.getElementById('clear-cart');
            const calculateTotalBtn = document.getElementById('calculate-total');
            const generateListBtn = document.getElementById('generate-list');
            const modal = document.getElementById('list-modal');
            const closeModalBtn = document.getElementById('close-modal');
            const copyListBtn = document.getElementById('copy-list');
            const listOutput = document.getElementById('list-output');

            loadProducts();
            loadSavedState();

            function setHighlight(input) {
                const raw = input.value || '';
                const num = parseFloat(raw);
                if (raw.trim() === '' || isNaN(num) || num === 0) {
                    input.classList.add('input-highlight');
                } else {
                    input.classList.remove('input-highlight');
                }
            }

            calculateTotalBtn.addEventListener('click', calculateTotal);
            clearCartBtn.addEventListener('click', clearCart);
            generateListBtn.addEventListener('click', generateTextList);
            closeModalBtn.addEventListener('click', () => modal.style.display = 'none');
            
            copyListBtn.addEventListener('click', () => {
                listOutput.select();
                navigator.clipboard.writeText(listOutput.value)
                    .then(() => {
                        copyListBtn.textContent = '✅ Copiado';
                        setTimeout(() => copyListBtn.textContent = 'Copiar', 1500);
                    })
                    .catch(() => alert('No se pudo copiar. Selecciónalo y copia manualmente.'));
            });

            function loadProducts() {
                for (const category in productsData) {
                    const categoryDiv = document.createElement('div');
                    categoryDiv.className = 'category';
                    const categoryTitle = document.createElement('div');
                    categoryTitle.className = 'category-title';
                    categoryTitle.textContent = category;
                    categoryDiv.appendChild(categoryTitle);
                    
                    productsData[category].forEach(product => {
                        const productItem = document.createElement('div');
                        productItem.className = 'product-item';
                        productItem.innerHTML = `
                            <div class="product-main">
                                <div class="checkbox-container">
                                    <input type="checkbox" id="${product.id}" data-category="${category}">
                                </div>
                                <label class="product-name" for="${product.id}">${product.name}</label>
                            </div>
                        `;
                        categoryDiv.appendChild(productItem);
                    });
                    shoppingList.appendChild(categoryDiv);
                }

                shoppingList.addEventListener('change', (e) => {
                    const target = e.target;
                    if (target && target.matches('input[type="checkbox"]')) {
                        if (target.checked) addToCart(target);
                        else removeFromCart(target);
                        saveState();
                    }
                });
            }

            function addToCart(checkbox) {
                const productWrapper = checkbox.closest('.product-item');
                if (!productWrapper) return;

                let inline = productWrapper.querySelector('.inline-inputs');
                if (!inline) {
                    inline = document.createElement('div');
                    inline.className = 'inline-inputs input-group';
                    inline.innerHTML = `
                        <div class="input-field">
                            <span class="input-label">Precio</span>
                            <input type="number" class="price-input" placeholder="Precio" min="0" step="0.01">
                        </div>
                        <div class="input-field">
                            <span class="input-label">Cantidad</span>
                            <input type="number" class="quantity-input" placeholder="Cantidad" min="1">
                        </div>
                        <div class="item-total">$0.00</div>
                    `;
                    productWrapper.appendChild(inline);
                }

                const priceInput = inline.querySelector('.price-input');
                const quantityInput = inline.querySelector('.quantity-input');

                setHighlight(priceInput);
                setHighlight(quantityInput);

                const priceClone = priceInput.cloneNode(true);
                const qtyClone = quantityInput.cloneNode(true);
                priceInput.parentNode.replaceChild(priceClone, priceInput);
                quantityInput.parentNode.replaceChild(qtyClone, quantityInput);

                inline.querySelector('.price-input').addEventListener('input', () => {
                    updateItemTotal(productWrapper);
                    setHighlight(inline.querySelector('.price-input'));
                    saveState();
                });
                inline.querySelector('.quantity-input').addEventListener('input', () => {
                    updateItemTotal(productWrapper);
                    setHighlight(inline.querySelector('.quantity-input'));
                    saveState();
                });
            }

            function removeFromCart(checkbox) {
                const productWrapper = checkbox.closest('.product-item');
                if (productWrapper) {
                    const inline = productWrapper.querySelector('.inline-inputs');
                    if (inline) inline.remove();
                }
                saveState();
            }

            function updateItemTotal(container) {
                const priceInput = container.querySelector('.price-input');
                const quantityInput = container.querySelector('.quantity-input');
                const itemTotal = container.querySelector('.item-total');
                const price = parseFloat(priceInput.value) || 0;
                const quantity = parseInt(quantityInput.value) || 0;
                itemTotal.textContent = `$${(price * quantity).toFixed(2)}`;
            }

            function calculateTotal() {
                let total = 0;
                document.querySelectorAll('.product-item input[type="checkbox"]:checked').forEach(cb => {
                    const wrapper = cb.closest('.product-item');
                    const priceInput = wrapper.querySelector('.price-input');
                    const quantityInput = wrapper.querySelector('.quantity-input');
                    if (!priceInput || !quantityInput) return;
                    const price = parseFloat(priceInput.value) || 0;
                    const quantity = parseInt(quantityInput.value) || 0;
                    const subtotal = price * quantity;
                    const itemTotalEl = wrapper.querySelector('.item-total');
                    if (itemTotalEl) itemTotalEl.textContent = `$${subtotal.toFixed(2)}`;
                    total += subtotal;
                });
                totalAmount.textContent = `$${total.toFixed(2)}`;
            }

            function clearCart() {
                document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                    cb.checked = false;
                    const wrapper = cb.closest('.product-item');
                    if (wrapper) {
                        const inline = wrapper.querySelector('.inline-inputs');
                        if (inline) inline.remove();
                    }
                });
                totalAmount.textContent = '$0.00';
                saveState();
            }

            function generateTextList() {
                const checked = document.querySelectorAll('.product-item input[type="checkbox"]:checked');
                if (checked.length === 0) {
                    alert('Marca al menos un producto para generar la lista.');
                    return;
                }
                let text = '';
                checked.forEach(cb => {
                    const wrapper = cb.closest('.product-item');
                    const name = wrapper.querySelector('.product-name').textContent;
                    const qtyInput = wrapper.querySelector('.quantity-input');
                    let qty = qtyInput ? parseInt(qtyInput.value) || 1 : 1;
                    text += `${name}: ${qty}\n`;
                });
                listOutput.value = text.trim();
                modal.style.display = 'flex';
            }

            function saveState() {
                const state = { checkedItems: [], prices: {}, quantities: {} };
                document.querySelectorAll('.product-item input[type="checkbox"]:checked').forEach(cb => {
                    state.checkedItems.push(cb.id);
                    const wrapper = cb.closest('.product-item');
                    state.prices[cb.id] = wrapper.querySelector('.price-input')?.value || '';
                    state.quantities[cb.id] = wrapper.querySelector('.quantity-input')?.value || '';
                });
                localStorage.setItem('shoppingListState', JSON.stringify(state));
            }

            function loadSavedState() {
                const saved = localStorage.getItem('shoppingListState');
                if (!saved) return;
                const state = JSON.parse(saved);
                state.checkedItems.forEach(id => {
                    const cb = document.getElementById(id);
                    if (cb && !cb.checked) {
                        cb.checked = true;
                        cb.dispatchEvent(new Event('change', { bubbles: true }));
                    }
                });
                setTimeout(() => {
                    Object.entries(state.prices).forEach(([id, price]) => {
                        const cb = document.getElementById(id);
                        if (!cb) return;
                        const wrapper = cb.closest('.product-item');
                        if (!wrapper) return;
                        const priceInput = wrapper.querySelector('.price-input');
                        const qtyInput = wrapper.querySelector('.quantity-input');
                        if (priceInput) { priceInput.value = price; setHighlight(priceInput); }
                        if (qtyInput) { qtyInput.value = state.quantities[id] || ''; setHighlight(qtyInput); }
                        updateItemTotal(wrapper);
                    });
                }, 50);
            }
        });
    </script>
</body>
</html>
